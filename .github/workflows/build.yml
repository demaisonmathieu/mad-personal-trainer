name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilation de l'APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk MADPersonalTrainer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MADPersonalTrainer-apk
          path: MADPersonalTrainer.apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MAD Personal Trainer 1.0.${{ github.run_number }}
          body: |
            Build automatique du commit ${{ github.sha }}.
            Lien permanent vers la dernière version :
            https://github.com/${{ github.repository }}/releases/latest/download/MADPersonalTrainer.apk
          files: MADPersonalTrainer.apk
          make_latest: true
